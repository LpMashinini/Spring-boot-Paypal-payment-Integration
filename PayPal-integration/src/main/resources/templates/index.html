<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">
    <title>Paypal Integration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6zQmc5Q0lY6pFAmWlZ9EOejk5bC5R5pXW5xg+" crossorigin="anonymous">

</head>

<body>
    <div class="container">
        <h1 class="text-center mt-5">Paypal Payment Integration</h1>

        <form action="/payment/create" method="post" class="mt-5 card p-3">

            <div class="d-flex justify-content-center">
                <button type="submit"
                        class="btn btn-primary"
                >
                    Pay with Paypal
                </button>
            </div>

        </form>
    </div>
</body>
</html>
